[project]
name = "isotile"
version = "0.1.0.dev0"
description = "Isohedral tilings in NumPy: the 81 isohedral types, tile generation and exact tile adjacency."
authors = [{ name = "FKloosterman", email = "devfakl@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "src/isotile/data/LICENSE-tactile"]
keywords = ["tiling", "isohedral", "tessellation", "numpy"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
shapely = ["shapely>=2.0"]
plot = []
all = ["shapely>=2.0"]

[project.urls]
Repository = "https://github.com/bright-fakl/isotile"

[dependency-groups]
tactile = ["tactile>=0.1.0"]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.5",
    "mypy>=1.10",
    "pre-commit>=2.20.0",
    "shapely>=2.0",
    "scipy-stubs",
    "hatchling",
]

docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26.1",
    # mkdocstrings builds its code highlighter with the pre-12 signature of pymdownx.highlight.
    "pymdown-extensions>=10.12,<12",
    # scripts/make_doc_figures.py draws the figures of the documentation.
    "matplotlib>=3.8",
]

[tool.uv]
# tactile is only needed by the equivalence tests; `uv sync --no-group tactile` leaves it out.
# The docs group is not synced by default: `uv sync --group docs`.
default-groups = ["dev", "tactile"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isotile"]

[tool.hatch.build.targets.sdist]
include = ["src/isotile", "tests", "benchmarks", "LICENSE", "NOTICE", "README.md", "CHANGELOG.md"]

[tool.mypy]
files = ["src"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tactile.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["tactile: compares with the tactile package (installed as a dev dependency only)"]

[tool.coverage.run]
branch = true
source = ["isotile"]
omit = ["*/_build_data.py"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Avoid specifying long messages outside the exception class
    "TRY003",
    # Abstract raise to an inner function
    "TRY301",
    # Function complexity - allow complex functions for algorithm code
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "S603"]
"benchmarks/*" = ["S101"]

[tool.ruff.format]
preview = true
