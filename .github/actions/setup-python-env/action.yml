name: "Setup Python Environment"
description: "Set up Python and the uv environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.12"
  uv-version:
    description: "uv version to use"
    required: true
    default: "0.8.17"
  sync-args:
    description: "Extra arguments for uv sync"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
     - uses: actions/setup-python@v6
       with:
         python-version: ${{ inputs.python-version }}

     - name: Install uv
       uses: astral-sh/setup-uv@v7
       with:
         version: ${{ inputs.uv-version }}
         enable-cache: 'true'
         cache-suffix: ${{ inputs.python-version }}

     - name: Install Python dependencies
       run: uv sync --frozen --python ${{ inputs.python-version }} ${{ inputs.sync-args }}
       shell: bash
