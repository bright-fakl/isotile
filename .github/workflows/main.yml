name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check the lock file
        run: uv lock --check

      - name: Ruff check
        run: uv run --no-sync ruff check --no-fix .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check typing (mypy --strict on src)
        run: uv run --no-sync mypy

  # The test matrix runs without tactile; the equivalence tests are skipped here and run in `tactile-equivalence`.
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          sync-args: --no-group tactile

      - name: Run tests with coverage
        run: uv run --no-sync python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=term-missing --cov-report=xml

      - name: Upload the coverage report
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  tactile-equivalence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment (with tactile)
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Verify tactile is installed
        run: uv run --no-sync python -c "import tactile"

      - name: Run the tactile equivalence tests
        run: uv run --no-sync python -m pytest tests -m tactile --no-cov

  data-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment (with tactile)
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Regenerate the data file and compare
        run: uv run --no-sync python -m isotile._build_data --check

  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"

      - name: Install the lowest versions of the direct dependencies
        run: |
          uv venv --python 3.10 /tmp/minvenv
          VIRTUAL_ENV=/tmp/minvenv uv pip install --resolution lowest-direct ".[shapely]" "pytest>=7.2.0"
          VIRTUAL_ENV=/tmp/minvenv uv pip list

      - name: Run tests
        run: |
          VIRTUAL_ENV=/tmp/minvenv uv run --no-project python -m pytest tests -p no:cacheprovider

  wheel-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.10"

      - name: Build the sdist and the wheel
        run: uv build -o dist

      - name: List the wheel
        run: uv run --no-sync python -m zipfile -l dist/isotile-*-py3-none-any.whl

      # The expected data files are read from the source tree, never hardcoded.
      - name: Verify the contents of the wheel, the sdist and the wheel built from the sdist
        run: uv run --no-sync python scripts/check_dist.py dist

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel into a clean venv
        run: |
          WHEEL=$(ls dist/isotile-*-py3-none-any.whl)
          uv venv /tmp/smokevenv --python 3.10
          VIRTUAL_ENV=/tmp/smokevenv uv pip install "$WHEEL"

      - name: Import and generate tiles from a neutral directory
        env:
          SCRIPT: ${{ github.workspace }}/scripts/smoke_test.py
        run: |
          mkdir -p /tmp/smoke-neutral
          cd /tmp/smoke-neutral
          VIRTUAL_ENV=/tmp/smokevenv uv run --no-project python "$SCRIPT"

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment (with the docs group)
        uses: ./.github/actions/setup-python-env
        with:
          sync-args: --group docs --no-group tactile

      - name: Check that the documentation builds (strict)
        run: uv run --no-sync mkdocs build -s -d site
