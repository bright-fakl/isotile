name: Publish to PyPI

# Triggers:
# - a tag `v*` pushed, or a GitHub release published: build, test, check, then upload to PyPI
#   (to TestPyPI if the version is a pre-release or development version);
# - a manual run (workflow_dispatch): build, test, check, then upload to TestPyPI. A manual run never uploads to PyPI.
# Creating a release together with its tag fires both tag events; the runs are serialized and the second one finds the
# version already on the index and uploads nothing.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      target: ${{ steps.plan.outputs.target }}
      published: ${{ steps.plan.outputs.published }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          sync-args: --no-group tactile

      - name: Read the package version and decide the target
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-sync python scripts/release_plan.py | tee -a "$GITHUB_OUTPUT"

      - name: Run the tests
        run: uv run --no-sync python -m pytest tests -m "not tactile" --no-cov -q

      - name: Build the sdist and the wheel
        run: uv build -o dist

      - name: Verify the contents of the wheel, the sdist and the wheel built from the sdist
        run: uv run --no-sync python scripts/check_dist.py dist --version "${{ steps.plan.outputs.version }}"

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel into a clean venv and run the smoke test
        env:
          SCRIPT: ${{ github.workspace }}/scripts/smoke_test.py
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          uv venv /tmp/smokevenv --python 3.10
          VIRTUAL_ENV=/tmp/smokevenv uv pip install dist/isotile-*-py3-none-any.whl
          mkdir -p /tmp/smoke-neutral
          cd /tmp/smoke-neutral
          VIRTUAL_ENV=/tmp/smokevenv uv run --no-project python "$SCRIPT" --version "$VERSION"

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: needs.build.outputs.target == 'pypi' && needs.build.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/isotile/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    if: needs.build.outputs.target == 'testpypi' && needs.build.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/isotile/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
