site_name: isotile
site_url: https://bright-fakl.github.io/isotile/
site_description: Isohedral tilings in NumPy - the 81 isohedral types, tile generation and exact tile adjacency.
site_author: FKloosterman
repo_url: https://github.com/bright-fakl/isotile
repo_name: bright-fakl/isotile
edit_uri: edit/main/docs/
copyright: Maintained by FKloosterman.

strict: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Adjacency: adjacency.md
  - API reference:
      - Overview: api/index.md
      - Tilings and tile sets: api/tiling.md
      - Tiling types: api/types.md
      - Prototile validity: api/prototile.md
      - Adjacency: api/adjacency.md
  - Development: development.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            summary: true
            members_order: source
            merge_init_into_class: true
            docstring_section_style: list
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]

theme:
  name: material
  # The logo and the favicon go here once the assets exist in docs/assets/:
  #   logo: assets/logo/mark-light.svg
  #   favicon: assets/logo/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bright-fakl/isotile

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
